<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050709">
  <title>&gt;_ access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="sf2_paid.png" fetchpriority="high">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <header class="topbar">
    <div class="logo">
      <span class="logo-bracket">[</span><span class="logo-text">root@hack</span><span class="logo-bracket">]</span><span class="logo-cursor"></span>
    </div>
    <nav class="lang-switch" aria-label="Language">
      <button class="lang-btn" data-lang="ru" type="button">RU</button>
      <span class="lang-sep">/</span>
      <button class="lang-btn" data-lang="en" type="button">EN</button>
    </nav>
  </header>

  <main class="stage">
    <div class="prompt" aria-live="polite">
      <span class="prompt-prefix">$</span><span class="prompt-text" id="promptText"></span><span class="prompt-cursor" id="promptCursor"></span>
    </div>
    <div class="answers" id="answers"></div>
    <div class="cards" id="cards"></div>
  </main>

  <footer class="bottombar">
    <span class="status">
      <span class="status-dot"></span>
      <span id="statusText">connection: secure</span>
    </span>
    <span class="meta" id="metaText">v0.1 · build alpha</span>
  </footer>

  <div class="support-popup-overlay" id="supportPopup" aria-hidden="true">
    <div class="support-popup">
      <button class="support-popup-close" id="supportPopupClose" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>
        </svg>
      </button>
      <p class="support-popup-text" id="supportPopupText"></p>
      <a class="support-popup-btn" id="supportPopupBtn" href="https://t.me/BotBotOfficial" target="_blank" rel="noopener noreferrer"></a>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
