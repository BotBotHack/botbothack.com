<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050709">
  <title>&gt;_ help</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Background layers -->
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- Top bar: logo + language switcher -->
  <header class="topbar">
    <a class="logo" href="index.html">
      <span class="logo-bracket">[</span><span class="logo-text">root@hack</span><span class="logo-bracket">]</span><span class="logo-cursor"></span>
    </a>
    <nav class="lang-switch" aria-label="Language">
      <button class="lang-btn" data-lang="ru" type="button">RU</button>
      <span class="lang-sep">/</span>
      <button class="lang-btn" data-lang="en" type="button">EN</button>
    </nav>
  </header>

  <main class="stage help-stage">
    <div class="help-main">
      <a class="help-back" href="index.html">
        <span aria-hidden="true">&lt;</span>
        <span data-ru="Назад" data-en="Back"></span>
      </a>

      <h1 class="help-title" data-ru="Как подключить DNS" data-en="How to set up DNS"></h1>
      <p class="help-intro" data-ru="Три шага. Минута времени." data-en="Three steps. One minute."></p>

      <div class="help-steps">

        <section class="help-step">
          <div class="help-step-head">
            <span class="help-step-num">1</span>
            <p class="help-step-text" data-ru="Зайди в настройки телефона, открой «Сеть и интернет» и нажми «Connection &amp; sharing»." data-en="Open phone settings, go to Network &amp; internet, and tap Connection &amp; sharing."></p>
          </div>
          <div class="help-step-img">
            <img src="step1.jpg" alt="Wireless &amp; networks screen, Connection &amp; sharing">
          </div>
        </section>

        <section class="help-step">
          <div class="help-step-head">
            <span class="help-step-num">2</span>
            <p class="help-step-text" data-ru="Открой «Private DNS»." data-en="Open Private DNS."></p>
          </div>
          <div class="help-step-img">
            <img src="step2.jpg" alt="Connection &amp; sharing screen, Private DNS">
          </div>
        </section>

        <section class="help-step">
          <div class="help-step-head">
            <span class="help-step-num">3</span>
            <p class="help-step-text" data-ru="Выбери «Specified DNS» и вставь адрес в поле «DNS address»:" data-en="Pick Specified DNS and paste this into the DNS address field:"></p>
          </div>
          <pre class="card-code help-code"><code>dns.botbothack.com</code><button type="button" class="code-copy-btn" aria-label="Copy"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button></pre>
          <div class="help-step-img">
            <img src="step3.jpg" alt="Private DNS screen, Specified DNS selected">
          </div>
          <p class="help-step-text help-step-note" data-ru="Сохрани и готово." data-en="Save and you're done."></p>
        </section>

      </div>
    </div>
  </main>

  <!-- Bottom status bar -->
  <a class="ios-btn" id="iosBtn" href="dns.botbothack.com.mobileconfig">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
    <span data-ru="iOS" data-en="iOS"></span>
  </a>

  <footer class="bottombar">
    <span class="status">
      <span class="status-dot"></span>
      <span id="statusText">connection: secure</span>
    </span>
    <span class="meta" id="metaText">v0.1 · build alpha</span>
  </footer>

  <script src="help.js"></script>
</body>
</html>
